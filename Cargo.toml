
[package]
name = "chem_alchemy"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.20.1", features = ["default", "bevy_ui"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.11.0"
thiserror = "2.0.17"
# Steam achievements, only in builds made with `--features steam`
steamworks = { version = "0.13.1", optional = true }

# The desktop window's icon is set through winit (the same winit Bevy uses).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
winit = { version = "0.30.12", default-features = false }

# A Windows build puts the icon on the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Android: opening links in the browser (an intent started over JNI). The same version
# android-activity already brings in.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# iOS: opening links in the browser (UIApplication openURL).
[target.'cfg(target_os = "ios")'.dependencies]
webbrowser = "1.2.7"

# The Android build (android/) shares this Cargo.lock and target folder. Commands run here
# still build only the game; the Android workflow builds android/.
[workspace]
members = ["android"]

[features]
# Steam integration (achievements); needs the Steam client running to do anything
steam = ["dep:steamworks"]
# release builds for players: no console window on Windows
gui = []

# The builds players download (the release workflow): a release build without its debug
# symbols, about 60 MB smaller.
[profile.dist]
inherits = "release"
strip = true

# Bevy systems take many parameters and query complex types by design.
[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
