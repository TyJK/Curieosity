# Every pull request: formatting, lints and the tests, then the review run (the interaction
# checks and a short playthrough, drawn by a software renderer under a virtual display). It
# runs once per pull request, not again when it merges: what merges is what was checked. A
# new push to the same branch cancels the run still going for the last one. The whole tech
# tree is played weekly, or on demand from the Actions tab ("Run workflow", tick "full").
# Each review uploads its report and screenshots; any failed check or step fails the run.
#
# Once the checks and the review pass, the Android and iOS apps are built (android.yml and
# ios.yml, called from here), for a pull request or a run started by hand; their APK and IPA
# are this run's artifacts. The weekly run builds nothing: nothing changed.
name: CI

on:
  pull_request:
  schedule:
    - cron: "37 7 * * 1" # Mondays: the full playthrough
  workflow_dispatch:
    inputs:
      full:
        description: "Play the whole tech tree (about an hour and a half)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the version rust-toolchain.toml names, with its components (rustup >= 1.28 no
      # longer installs it on first use; older rustup does, so either way it is there)
      - name: Rust
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Libraries Bevy builds against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo clippy --release --all-targets --features steam,gui -- -D warnings
      - run: cargo test --release

  review:
    name: Review run
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      # the version rust-toolchain.toml names, with its components (rustup >= 1.28 no
      # longer installs it on first use; older rustup does, so either way it is there)
      - name: Rust
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      # the game's window loads the X11 libraries (the keyboard's among them) when it starts,
      # so the runtime ones are needed as well as those it builds against
      - name: Libraries, a virtual display and a software Vulkan renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxrandr2 libxi6 xvfb mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Play
        env:
          WGPU_BACKEND: vulkan
          RUST_LOG: warn,chem_alchemy=info
          FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
        run: |
          if [ "$FULL" = "true" ]; then STEPS=""; else STEPS="--steps 160 --every 40"; fi
          xvfb-run -a -s "-screen 0 1280x720x24" cargo run --release -- --autoplay --out review $STEPS
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.run_number }}
          path: review/
          retention-days: 30

  android:
    name: Android
    needs: [check, review]
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    name: iOS
    needs: [check, review]
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/ios.yml
    secrets: inherit
