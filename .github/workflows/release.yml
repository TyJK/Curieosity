# Every merge to main publishes a release by itself: the game for Windows, macOS and Linux,
# each packed with its assets, licences and the third-party notices, and the Android and iOS
# apps (android.yml and ios.yml), as a GitHub release marked latest. The phone apps get fixed
# names, Curieosity-android.apk and Curieosity-ios.ipa, so the README's
# releases/latest/download/<name> links always fetch the newest.
#
# Nobody makes tags. A release is numbered from Cargo.toml's version, its last number
# counting up past the releases already made: version = "0.2.0" gives v0.2.0, then v0.2.1,
# v0.2.2 and so on. To start a new series, change the version there (to 0.3.0, say). Two
# merges close together publish only the newer.
# Steam builds (with achievements) are made too, as workflow artifacts rather than public
# downloads: they are uploaded to Steam, not handed out. Set the repository variable
# STEAM_APP_ID once the game has its own Steam app; until then they use 480, Valve's test
# app.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Number the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # with the tags of the releases already made
      - id: next
        run: |
          BASE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          SERIES="${BASE%.*}"; N="${BASE##*.}"
          while git rev-parse -q --verify "refs/tags/v$SERIES.$N" > /dev/null; do N=$((N + 1)); done
          echo "version=$SERIES.$N" >> "$GITHUB_OUTPUT"
          echo "This release is v$SERIES.$N"

  build:
    name: ${{ matrix.name }}${{ matrix.steam && ' (Steam)' || '' }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, exe: chem_alchemy.exe, steam: false }
          - { name: macos, os: macos-latest, exe: chem_alchemy, steam: false }
          - { name: linux, os: ubuntu-latest, exe: chem_alchemy, steam: false }
          - { name: windows, os: windows-latest, exe: chem_alchemy.exe, steam: true }
          - { name: linux, os: ubuntu-latest, exe: chem_alchemy, steam: true }
    steps:
      - uses: actions/checkout@v5
      # the version rust-toolchain.toml names, with its components (rustup >= 1.28 no
      # longer installs it on first use; older rustup does, so either way it is there)
      - name: Rust
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Libraries Bevy builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.steam && 'steam' || 'plain' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build
        shell: bash
        env:
          CURIEOSITY_STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
        run: |
          if [ "${{ matrix.steam }}" = "true" ]; then
            # Linux: find libsteam_api.so next to the game
            [ "$RUNNER_OS" = "Linux" ] && export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN'
            cargo build --profile dist --features steam,gui
          else
            cargo build --profile dist --features gui
          fi
      - name: Pack
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SUFFIX="${{ matrix.name }}"; [ "${{ matrix.steam }}" = "true" ] && SUFFIX="steam-${{ matrix.name }}"
          DIR="Curieosity"
          mkdir -p "$DIR"
          EXE="Curieosity"; [ "$RUNNER_OS" = "Windows" ] && EXE="Curieosity.exe"
          cp "target/dist/${{ matrix.exe }}" "$DIR/$EXE"
          cp -r assets "$DIR/assets"
          cp LICENSE-MIT LICENSE-APACHE LICENSE-CONTENT.md CREDITS.md "$DIR/"
          FEATURES=""; [ "${{ matrix.steam }}" = "true" ] && FEATURES="--features steam"
          cargo about generate $FEATURES .github/about.hbs -c .github/about.toml -o "$DIR/THIRD-PARTY-LICENSES.html"
          if [ "${{ matrix.steam }}" = "true" ]; then
            for lib in steam_api64.dll libsteam_api.so; do
              found=$(find target/dist/build -path "*steamworks-sys*/out/$lib" | head -n 1)
              [ -n "$found" ] && cp "$found" "$DIR/"
            done
          fi
          NAME="Curieosity-$VERSION-$SUFFIX"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$NAME.zip" "$DIR" > /dev/null; echo "ARCHIVE=$NAME.zip" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "macOS" ]; then zip -qr "$NAME.zip" "$DIR"; echo "ARCHIVE=$NAME.zip" >> "$GITHUB_ENV"
          else tar czf "$NAME.tar.gz" "$DIR"; echo "ARCHIVE=$NAME.tar.gz" >> "$GITHUB_ENV"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.steam && 'steam-' || '' }}${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  android:
    name: Android
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    name: iOS
    uses: ./.github/workflows/ios.yml
    secrets: inherit

  publish:
    name: Publish the release
    needs: [version, build, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      # the phone apps under fixed names, for the README's links
      - name: Name the phone apps
        run: |
          cp dist/Curieosity-android-*/*.apk dist/Curieosity-android.apk
          cp dist/Curieosity-ios-*/*.ipa dist/Curieosity-ios.ipa
          ls -l dist/*.apk dist/*.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Curieosity ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/windows/*
            dist/macos/*
            dist/linux/*
            dist/Curieosity-android.apk
            dist/Curieosity-ios.ipa
