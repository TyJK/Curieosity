plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tyjk.curieosity'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tyjk.curieosity'
        minSdk 31
        targetSdk 34
        // minutes since 2025, so a newer APK always installs over an older one, whether CI
        // or a release built it (each workflow's own run number counts separately)
        versionCode((int) ((System.currentTimeMillis() / 1000L - 1735689600L) / 60L))
        // the game's version, from Cargo.toml
        versionName((new File(rootDir, '../Cargo.toml').text =~ /(?m)^version\s*=\s*"([^"]+)"/)[0][1])
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            // the workflow writes the repository's own key here when it has one, so every
            // build is signed alike and installs over the last without losing progress
            def key = System.getenv('CURIEOSITY_KEYSTORE')
            if (key) {
                storeFile file(key)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // for installing by hand, not the Play Store
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // the game's own assets folder, as is: Bevy reads it from inside the APK
            assets.srcDirs = ['../../assets']
        }
    }

    lint {
        // a build to install by hand: the Play Store's release checks don't apply yet
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            // compressed in the APK (a much smaller download), unpacked when installed
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // the Java half of GameActivity; android-activity 0.6 (in Bevy 0.17) is built against 2.0.2
    implementation 'androidx.games:games-activity:2.0.2'
}
